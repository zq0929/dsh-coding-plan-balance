name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax-check both plugin halves
        run: |
          node --check index.js
          node --check client.js
      - name: Check the manifest, patch, client id, locales, and icon
        run: node scripts/check.mjs
